<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حقك عليا يا أغلى الناس ✨</title>
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <!-- مكتبة احتفالات لزر النجاح -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #4a1236 0%, #1e0015 70%, #0d0009 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* هالة ضوئية تتبع اللمس / الماوس */
        .cursor-glow {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255, 105, 180, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: width 0.3s, height 0.3s;
        }

        /* قلوب الخلفية الطائرة */
        .floating-heart {
            position: absolute;
            font-size: 28px;
            animation: floatUpHearts 5s linear infinite;
            z-index: 0;
            filter: drop-shadow(0 0 12px rgba(255, 105, 180, 0.8));
            opacity: 0.7;
        }

        @keyframes floatUpHearts {
            0% { transform: translateY(110vh) scale(0.5) rotate(0deg); opacity: 0; }
            40% { opacity: 0.9; }
            100% { transform: translateY(-15vh) scale(1.3) rotate(360deg); opacity: 0; }
        }

        /* الكارت الرئيسي بتأثير نيون متوهج */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            padding: 45px 30px;
            border-radius: 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 
                        inset 0 0 25px rgba(255, 182, 193, 0.2),
                        0 0 40px rgba(255, 94, 98, 0.3);
            text-align: center;
            width: 90%;
            max-width: 420px;
            z-index: 10;
            position: relative;
            animation: cardGlow 4s infinite alternate;
        }

        @keyframes cardGlow {
            0% { border-color: rgba(255, 94, 98, 0.4); box-shadow: 0 0 30px rgba(255, 94, 98, 0.3); }
            100% { border-color: rgba(56, 239, 125, 0.4); box-shadow: 0 0 45px rgba(56, 239, 125, 0.3); }
        }

        /* اهتزاز الكارت عند الهروب */
        .shake {
            animation: shakeCard 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shakeCard {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .emoji-icon {
            font-size: 80px;
            margin-bottom: 10px;
            display: inline-block;
            animation: bounceEmoji 1.5s infinite ease-in-out;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        @keyframes bounceEmoji {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.1); }
        }

        h1 {
            color: #ffffff;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 12px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
            letter-spacing: 0.5px;
        }

        #msg {
            color: #ffccd5;
            font-size: 19px;
            font-weight: 700;
            min-height: 60px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            line-height: 1.5;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            height: 80px;
        }

        .btn {
            padding: 15px 42px;
            font-size: 22px;
            font-weight: 900;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            outline: none;
            position: absolute;
        }

        /* زر "اه" - الهروب والمراغمة */
        #btn-yes {
            background: linear-gradient(135deg, #ff0844, #ffb199);
            color: white;
            right: 15px;
            box-shadow: 0 8px 25px rgba(255, 8, 68, 0.6);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 5;
        }

        /* زر "لا" - الجذاب والمضيء والمكبر تلقائياً */
        #btn-no {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            left: 15px;
            box-shadow: 0 8px 30px rgba(56, 239, 125, 0.7);
            animation: pulseGreen 1.5s infinite alternate;
            z-index: 4;
            transition: transform 0.3s ease;
        }

        @keyframes pulseGreen {
            0% { box-shadow: 0 0 15px rgba(56, 239, 125, 0.5); }
            100% { box-shadow: 0 0 35px rgba(56, 239, 125, 0.9), 0 0 15px #ffffff; }
        }

        /* القلوب المتفجرة عند الهروب */
        .burst-heart {
            position: absolute;
            pointer-events: none;
            font-size: 24px;
            animation: burstAnim 0.8s ease-out forwards;
            z-index: 20;
        }

        @keyframes burstAnim {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* شاشة النجاح */
        .success-box {
            animation: popSuccess 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popSuccess {
            0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .success-box h2 {
            color: #ff8fa3;
            font-size: 34px;
            margin-bottom: 15px;
            font-family: 'Amiri', serif;
            text-shadow: 0 4px 20px rgba(255, 143, 163, 0.6);
        }

        .success-box p {
            color: #ffffff;
            font-size: 20px;
            line-height: 1.8;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- هالة ضوئية متحركة -->
    <div class="cursor-glow" id="glow"></div>

    <!-- قلوب خلفية طائرة -->
    <div class="floating-heart" style="left: 8%; animation-delay: 0s;">❤️</div>
    <div class="floating-heart" style="left: 28%; animation-delay: 2.5s;">💖</div>
    <div class="floating-heart" style="left: 50%; animation-delay: 1s;">✨</div>
    <div class="floating-heart" style="left: 72%; animation-delay: 3.5s;">🤍</div>
    <div class="floating-heart" style="left: 88%; animation-delay: 1.8s;">🌸</div>

    <div class="card" id="card">
        <div class="emoji-icon" id="card-emoji">🥺</div>
        <h1 id="title">لسه زعلانه؟</h1>
        <div id="msg">اضغطي وشوفي.. مقدرش على زعل القمر! ✨</div>
        
        <div class="buttons-container" id="btn-area">
            <button class="btn" id="btn-yes" onclick="moveYesButton(event)">اه</button>
            <button class="btn" id="btn-no" onclick="openSuccessPage()">لا</button>
        </div>
    </div>

    <script>
        // متابعة حركة الماوس أو اللمس لإعطاء إضاءة خلفية ممتازة للفيديو
        const glow = document.getElementById('glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });
        window.addEventListener('touchmove', (e) => {
            glow.style.left = e.touches[0].clientX + 'px';
            glow.style.top = e.touches[0].clientY + 'px';
        });

        const messages = [
            "متزعليش طيب مني يا روحي! 💔",
            "حقك عليا، خلاص بقى متبقيش قاسية! 🥺",
            "والله ما أقصد أزعلك دقيقة واحدة! 🙏",
            "طب بلاش زعل، العتاب غالي بس رضاكي أغلى! 🌸",
            "قلبك أبيض وعارفه، سامحيني بقى! 🤍",
            "خلاص حقك عليا, ابتسامة بقى عشان نخلص؟ 😊",
            "مقدرش على زعل القمر ده أصلاً! ✨",
            "الزرار بيبعد عشان عارف إنك مش زعلانة! 😂❤️"
        ];

        const emojis = ["🥺", "😭", "💔", "😔", "🙈", "👉👈", "🌹", "🥰"];

        let msgIndex = 0;
        let noScale = 1;

        function moveYesButton(e) {
            const btnYes = document.getElementById('btn-yes');
            const btnNo = document.getElementById('btn-no');
            const msgDiv = document.getElementById('msg');
            const emojiDiv = document.getElementById('card-emoji');
            const card = document.getElementById('card');

            // انفجار قلوب عند موقع الزرار قبل الهروب
            createBurst(e.clientX || e.pageX, e.clientY || e.pageY);

            // اهتزاز الكارت
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 350);

            // تحديث النصوص
            msgDiv.innerText = messages[msgIndex];
            emojiDiv.innerText = emojis[msgIndex % emojis.length];
            msgIndex = (msgIndex + 1) % messages.length;

            // تكبير زرار "لا" تدريجياً ليشجع على الضغط عليه!
            noScale += 0.12;
            if (noScale <= 2.2) {
                btnNo.style.transform = `scale(${noScale})`;
            }

            // حركة هروب عشوائية ودوران
            const maxX = 130;
            const maxY = 90;

            const randomX = (Math.random() - 0.5) * maxX * 2;
            const randomY = (Math.random() - 0.5) * maxY * 2;
            const randomRot = (Math.random() - 0.5) * 80;

            btnYes.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${randomRot}deg) scale(0.9)`;
        }

        // تأثير انفجار القلوب المصغرة
        function createBurst(x, y) {
            for (let i = 0; i < 8; i++) {
                const heart = document.createElement('div');
                heart.className = 'burst-heart';
                heart.innerText = ['💔', '✨', '🌸', '💖'][Math.floor(Math.random() * 4)];
                heart.style.left = x + 'px';
                heart.style.top = y + 'px';
                
                const tx = (Math.random() - 0.5) * 160 + 'px';
                const ty = (Math.random() - 0.5) * 160 + 'px';
                heart.style.setProperty('--tx', tx);
                heart.style.setProperty('--ty', ty);

                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 800);
            }
        }

        function openSuccessPage() {
            const card = document.getElementById('card');
            
            // احتفال ناري بالقلوب والألوان
            launchCelebration();

            card.innerHTML = `
                <div class="emoji-icon">🥰</div>
                <div class="success-box">
                    <h2>يدوم لي قلبك الطيب يارب ❤️</h2>
                    <p>ألف حمدالله عالسلامة من الزعل.. <br>أحلى عيون في الدنيا دي ميهونش عليا تزعل أبداً ✨🌹</p>
                </div>
            `;
        }

        function launchCelebration() {
            var duration = 3.5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 35, spread: 360, ticks: 80, zIndex: 1000 };

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 60 * (timeLeft / duration);
              
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: 0.2, y: 0.3 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: 0.8, y: 0.3 } }));
            }, 200);
        }
    </script>

</body>
</html>
